# Copy of the notification locations in /etc/nginx/sites-available/smartpro-edu.com (server block for
# smartpro-edu.com, before the /preview/ location). The rate-limit zone sp_push is in /etc/nginx/conf.d/smartpro-push.conf:
#   limit_req_zone $binary_remote_addr zone=sp_push:10m rate=30r/m;
# Admin password file: /etc/nginx/smartpro-admin.htpasswd (user smartpro).

    # Notifications (server/push in the app's repo, systemd smartpro-push on 127.0.0.1:3120). X-Site tells the
    # service which site a request is for; /preview/... is the preview's own subscribers and history.
    location ^~ /api/push/ {
        limit_req zone=sp_push burst=20 nodelay;
        include snippets/smartpro-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_set_header X-Site live;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3120;
    }
    location ^~ /preview/api/push/ {
        limit_req zone=sp_push burst=20 nodelay;
        include snippets/smartpro-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_set_header X-Site preview;
        proxy_set_header Host $host;
        rewrite ^/preview(/api/push/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3120;
    }
    # The owner's page for sending notifications: password first.
    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        auth_basic "Smart Pro";
        auth_basic_user_file /etc/nginx/smartpro-admin.htpasswd;
        include snippets/smartpro-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_set_header X-Site live;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3120;
    }
    location = /preview/admin { return 301 /preview/admin/; }
    location ^~ /preview/admin/ {
        auth_basic "Smart Pro";
        auth_basic_user_file /etc/nginx/smartpro-admin.htpasswd;
        include snippets/smartpro-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_set_header X-Site preview;
        proxy_set_header Host $host;
        rewrite ^/preview(/admin/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3120;
    }

