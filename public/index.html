<script>
// Runs before first paint: saved theme and language, and whether we were opened as the installed app
// (start_url carries ?source=app), so the page never shows its own logo on top of the system launch screen.
(function () {
  var d = document.documentElement;
  try {
    // Arabic unless the student chose English (matches DEFAULT_LANG in i18n.js).
    if (localStorage.getItem('topgrade.lang') === 'en') { d.lang = 'en'; d.dir = 'ltr'; }
    var theme = localStorage.getItem('topgrade.theme');
    d.dataset.theme = theme === 'dark' || theme === 'light' ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) { d.dataset.theme = 'light'; }
  if (/[?&]source=app\b/.test(location.search) || navigator.standalone || matchMedia('(display-mode: standalone)').matches) d.classList.add('installed');
})();
</script>
<style>
/* Shown until the app's first screen replaces it (also matches the install splash colour). */
.splash{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:#F3F6F5}
.splash img{width:150px;height:auto}
/* The installed app already gets the system launch screen with the logo; don't show it a second time. */
[data-theme=dark] .splash{background:#070B0A}
.splash__dark,[data-theme=dark] .splash__light{display:none}
[data-theme=dark] .splash__dark{display:block}
.installed .splash img{display:none}
@media (display-mode: standalone),(display-mode: fullscreen){.splash img{display:none}}
</style>
